name: kamusic
base: core26
version: "0.1.31"
title: KAMUSIC
summary: Reproductor de música moderno para Ubuntu GTK4/Libadwaita
description: |
  KAMUSIC es un reproductor de música local elegante y funcional diseñado específicamente para Ubuntu.

  Características principales:
  * Interfaz moderna basada en GTK4 y Libadwaita.
  * Biblioteca musical local con escaneo automático.
  * Soporte para múltiples formatos mediante GStreamer.
  * Radio online integrada.
  * Descarga automática de carátulas.
  * Integración con MPRIS para controles multimedia del sistema.
  * Diseño adaptativo y modo oscuro nativo.

license: GPL-3.0-or-later
icon: data/org.kampos.kamusic.svg
website: https://kampos.info
contact: mailto:kampos.info@gmail.com
source-code: https://github.com/kampos/KAMUSIC
issues: https://github.com/kampos/KAMUSIC/issues

grade: stable
confinement: strict

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  kamusic:
    command: bin/kamusic
    command-chain:
      - snap/command-chain/desktop-launch
    desktop: usr/share/applications/org.kampos.kamusic.desktop
    common-id: org.kampos.kamusic

    environment:
      GST_PLUGIN_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gstreamer-1.0
      GST_PLUGIN_PATH_1_0: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gstreamer-1.0
      GST_PLUGIN_SYSTEM_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gstreamer-1.0
      GST_PLUGIN_SYSTEM_PATH_1_0: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gstreamer-1.0
      GST_PLUGIN_SCANNER: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gstreamer1.0/gstreamer-1.0/gst-plugin-scanner

      GIO_MODULE_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gio/modules
      GSETTINGS_SCHEMA_DIR: $SNAP/usr/share/glib-2.0/schemas

      SSL_CERT_FILE: $SNAP/etc/ssl/certs/ca-certificates.crt
      CURL_CA_BUNDLE: $SNAP/etc/ssl/certs/ca-certificates.crt

      XDG_DATA_DIRS: $SNAP/usr/share:$XDG_DATA_DIRS

    plugs:
     - home
     - removable-media
     - network
     - network-status
     - audio-playback
     - desktop
     - desktop-legacy
     - gsettings
     - opengl
     - wayland
     - x11

parts:
  kamusic:
    plugin: rust
    source: .

    build-packages:
      - pkg-config
      - libgtk-4-dev
      - libadwaita-1-dev
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev
      - libglib2.0-bin

    stage-packages:
      - libgtk-4-1
      - libadwaita-1-0

      - libgstreamer1.0-0
      - libgstreamer-plugins-base1.0-0
      - gstreamer1.0-tools
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-plugins-ugly
      - gstreamer1.0-libav
      - gstreamer1.0-gtk4
      - gstreamer1.0-pulseaudio

      - libpulse0
      - libasound2-data
      - alsa-ucm-conf
      - libasound2-plugins

      - glib-networking
      - glib-networking-services
      - glib-networking-common
      - libproxy1v5
      - libsoup-3.0-0
      - ca-certificates

      - gsettings-desktop-schemas
      - fontconfig
      - hicolor-icon-theme
      - adwaita-icon-theme
      - at-spi2-core

    override-build: |
      craftctl default

      glib-compile-schemas "$CRAFT_PART_INSTALL/usr/share/glib-2.0/schemas"

      install -Dm644 data/org.kampos.kamusic.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/org.kampos.kamusic.desktop"

      install -Dm644 data/org.kampos.kamusic.svg \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/org.kampos.kamusic.svg"

      install -Dm644 data/org.kampos.kamusic.metainfo.xml \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/org.kampos.kamusic.metainfo.xml"

      mkdir -p "$CRAFT_PART_INSTALL/usr/share/kamusic/icons"

      for icon in data/icons/*.svg; do
        install -Dm644 "$icon" \
          "$CRAFT_PART_INSTALL/usr/share/kamusic/icons/$(basename "$icon")"
      done

  command-chain:
    plugin: dump
    source: snap/command-chain/
    organize:
      desktop-launch: snap/command-chain/desktop-launch
    prime:
      - snap/command-chain/desktop-launch
