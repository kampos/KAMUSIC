[package]
name = "kamusic"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Reproductor de musica local GTK4/Libadwaita para Ubuntu"

[dependencies]
anyhow = "1.0"
directories = "6.0"
gstreamer = { version = "0.25.2", optional = true }
gtk = { package = "gtk4", version = "0.11.3", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9.1", features = ["v1_5"] }
mpris-server = "0.10.0"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
walkdir = "2.5"

[features]
default = ["gst"]
gst = ["dep:gstreamer"]
